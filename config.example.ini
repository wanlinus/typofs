# Typora 图床配置（key=value，支持 # 注释）
# 放到 typofs.exe 同目录，命名改为 config.ini
#
# endpoint / preUrl 默认走 http；填 https://... 则走 https。
# preUrl 可选：不填时自动用 endpoint（无 nginx/CDN 时两者相同）。
# 若图片经反代/CDN 暴露（如 https://img.example.com），再填 preUrl 覆盖。

endpoint = http://<s3-host>:9000
username = <access key>
password = <secret key>
buckets = tuchuang
# preUrl = http://<s3-host>:9000   # 可选，缺省=endpoint
